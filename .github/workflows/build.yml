name: Build Windows EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pyinstaller numpy sounddevice scipy PyQt5
      - run: pyinstaller --noconsole --onefile --name "Price_Mixing" Price_Mixing.py
      - uses: actions/upload-artifact@v4
        with:
          name: Price_Mixing_EXE
          path: dist/Price_Mixing.exe
